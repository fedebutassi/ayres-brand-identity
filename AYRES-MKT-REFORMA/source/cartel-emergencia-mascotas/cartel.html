<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1080, initial-scale=1">
    <title>AYRES · Cartel emergencia mascotas</title>
    <style>
      @font-face{font-family:Florensa;src:url(../../../social/carrusel-14-gastritis-gatos/assets/Florensa-Demo.ttf) format("truetype");font-weight:400;font-display:block}
      @font-face{font-family:Arboria;src:url(../../../social/carrusel-14-gastritis-gatos/assets/Arboria-Black.ttf) format("truetype");font-weight:900;font-display:block}
      :root{--green:#3db870;--dark:#3e484e;--deep:#222b2f;--cream:#f5f4f2}
      *{box-sizing:border-box}
      html,body{width:1080px;height:1080px;margin:0;overflow:hidden}
      body{-webkit-font-smoothing:antialiased}
      .cartel{position:relative;width:1080px;height:1080px;display:flex;flex-direction:column;align-items:center;padding:96px 80px 76px;background:linear-gradient(160deg,#2c363b,#1d2529 62%,#141c20);color:#fff;text-align:center}
      .cartel:before{position:absolute;top:-240px;right:-220px;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(61,184,112,.28),transparent 68%);content:""}
      .cartel:after{position:absolute;left:-300px;bottom:-380px;width:760px;height:760px;border:1px solid rgba(61,184,112,.3);border-radius:50%;content:""}
      body.light .cartel{background:linear-gradient(150deg,#faf9f6,#f0eee9 66%,#e6ebe6);color:var(--dark)}
      body.light .cartel:before{background:radial-gradient(circle,rgba(61,184,112,.22),transparent 68%)}
      .badge{position:relative;z-index:1;padding:20px 40px;border:2px solid var(--green);border-radius:100px;color:var(--green);font:900 30px Arboria,Arial,sans-serif;letter-spacing:5px}
      h1{position:relative;z-index:1;margin:52px 0 0;font:400 96px/1 Florensa,Arial,sans-serif;letter-spacing:-1px;text-transform:uppercase}
      /* Huella */
      .paw{position:relative;z-index:1;width:440px;height:440px;margin:36px auto 0}
      .paw canvas{width:100%;height:100%}
      h2{position:relative;z-index:1;margin:44px 0 0;font:900 88px/1 Arboria,Arial,sans-serif;letter-spacing:6px;text-transform:uppercase}
      .sub{position:relative;z-index:1;margin:26px 0 0;font:400 27px/1.3 Florensa,Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;color:#c8d1d4;white-space:nowrap}
      body.light .sub{color:#7a8a92}
      footer{position:relative;z-index:1;margin-top:auto;display:flex;width:100%;align-items:center;justify-content:space-between;padding-top:30px;border-top:1px solid rgba(255,255,255,.25)}
      body.light footer{border-color:rgba(62,72,78,.23)}
      footer img{width:210px}
      footer span{color:var(--green);font:900 22px Arboria,Arial,sans-serif;letter-spacing:2px}
    </style>
  </head>
  <body>
    <main class="cartel">
      <div class="badge">EN CASO DE EMERGENCIA</div>
      <h1>Aquí viven</h1>
      <div class="paw" aria-hidden="true">
        <canvas id="paw" width="1400" height="1400"></canvas>
      </div>
      <h2>Animales</h2>
      <p class="sub">Escribí la cantidad en la huella · Por favor, rescatalos</p>
      <footer>
        <img id="logo" src="../../../assets/logo-dark.svg" alt="AYRES Pet Supply">
        <span>@AYRES.PETSUPPLY</span>
      </footer>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      if (params.get('v') === 'light') {
        document.body.classList.add('light');
        document.getElementById('logo').src = '../../../assets/logo-light.svg';
      }
      // Huella: negro -> verde AYRES, blanco -> transparente
      const img = new Image();
      img.src = 'paw.jpg';
      img.onload = () => {
        const canvas = document.getElementById('paw');
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const px = data.data;
        for (let i = 0; i < px.length; i += 4) {
          const lum = (px[i] + px[i + 1] + px[i + 2]) / 3;
          px[i] = 61; px[i + 1] = 184; px[i + 2] = 112;
          px[i + 3] = 255 - lum;
        }
        ctx.putImageData(data, 0, 0);
      };
    </script>
  </body>
</html>
