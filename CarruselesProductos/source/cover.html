<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1080, initial-scale=1">
    <link rel="stylesheet" href="cover.css">
    <title>Portadas de productos AYRES</title>
  </head>
  <body>
    <main id="cover" class="cover">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>

      <header>
        <img src="../../assets/logo-light.svg" alt="AYRES Pet Supply">
        <span id="badge"></span>
      </header>

      <section class="intro">
        <p id="eyebrow"></p>
        <h1 id="title"></h1>
        <h2 id="subtitle"></h2>
      </section>

      <section id="brands" class="brands" aria-label="Marcas del carrusel"></section>
      <section id="products" class="products" aria-label="Productos destacados"></section>

      <footer>
        <b id="cta"></b>
        <span>Información declarada en productos.json</span>
      </footer>
    </main>
    <script src="cover.js"></script>
  </body>
</html>
