<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1080, initial-scale=1">
    <link rel="stylesheet" href="chat-retail.css">
    <title>Chatbot AYRES · Compra minorista</title>

  <body>

      <section class="safe-area">

            <label>AYRES</label>

        <section class="callout">
          <b>HABLÁ CON AYRES</b>

        <footer>ayrespetsupply.com</footer>
