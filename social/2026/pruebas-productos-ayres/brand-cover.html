<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1080, initial-scale=1">
    <link rel="stylesheet" href="brand-cover.css">
    <title>Marcas y productos en AYRES</title>
  </head>
  <body>
    <main class="cover">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>

      <header>
        <img src="../../../assets/logo-light.svg" alt="AYRES Pet Supply">
        <span>SELECCIÓN DE MARCAS</span>
      </header>

      <section class="intro">
        <p>PRODUCTOS PARA PERROS Y GATOS</p>
        <h1>Marcas y productos<br>en AYRES</h1>
        <h2>Conocé una selección y compará su información nutricional.</h2>
      </section>

      <section class="brand-row" aria-label="Marcas seleccionadas">
        <div><img src="../../../media/logos/FAWNA-LOGO2.png" alt="Fawna"></div>
        <div><img src="../../../media/logos/OLD-PRINCE-LOGO2.png" alt="Old Prince"></div>
        <div><img src="../../../media/logos/KONGO-LOGO-2.png" alt="Kongo"></div>
        <div><img src="../../../media/logos/MAINTENANCES-LOGO2.png" alt="Maintenance Criadores"></div>
        <div><img src="../../../media/logos/NATURAL-MEAT-LOGO.png" alt="Natural Meat"></div>
      </section>

      <section class="products" aria-label="Productos seleccionados">
        <img class="pack pack-one" src="assets/cutouts-exactos/fawna-gatito.png" alt="Fawna Gatito">
        <img class="pack pack-two" src="assets/cutouts-exactos/op-pn-lamb-adult-small.png" alt="Old Prince Cordero Adulto">
        <img class="pack pack-three" src="assets/cutouts-exactos/kongo-gatos-adultos-salmon-atun.png" alt="Kongo Gatos Adultos">
        <img class="pack pack-four" src="assets/cutouts-exactos/maintenance-criadores-adulto.png" alt="Maintenance Criadores Adulto">
        <img class="pack pack-five" src="assets/cutouts-exactos/natural-meat-perros-adultos.png" alt="Natural Meat Perros Adultos">
      </section>

      <footer>
        <b>Deslizá para conocer cada producto</b>
        <span>Datos declarados en productos.json</span>
      </footer>
    </main>
  </body>
</html>
