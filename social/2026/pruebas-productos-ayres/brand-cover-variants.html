<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1080, initial-scale=1">
    <link rel="stylesheet" href="brand-cover-base.css">
    <link rel="stylesheet" href="brand-cover-variants.css">
    <title>Portadas de carrusel AYRES</title>
  </head>
  <body>
    <main id="cover" class="cover">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>
      <header>
        <img src="../../../assets/logo-light.svg" alt="AYRES Pet Supply">
        <span id="badge"></span>
      </header>
      <section class="intro">
        <p id="eyebrow"></p>
        <h1 id="title"></h1>
        <h2 id="subtitle"></h2>
      </section>
      <section id="logos" class="logos"></section>
      <section id="labels" class="labels"></section>
      <section id="products" class="products"></section>
      <section id="stats" class="stats"></section>
      <footer>
        <b id="cta"></b>
        <span>Datos declarados en productos.json</span>
      </footer>
    </main>
    <script src="brand-cover-variants.js"></script>
  </body>
</html>
